// Optional diagnostic APK that installs beside the normal app.
// Run from android/: gradlew.bat -I tools/autofill-test.init.gradle :app:assembleDebug
gradle.beforeProject { project ->
    project.plugins.withId('com.android.application') {
        project.android.buildTypes.debug.applicationIdSuffix = '.autofilltest'
        project.android.sourceSets.debug.res.srcDir(project.rootProject.file('tools/autofill-test-res'))
    }
}
