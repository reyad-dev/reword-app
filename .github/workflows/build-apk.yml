name: Verify & Build Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Verify and build Android APK
        run: |
          cd android
          ./gradlew testDebugUnitTest assembleDebug lintDebug --no-daemon --stacktrace

      - name: Prepare APK artifact
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ReWord.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReWord-APK
          path: ReWord.apk
          if-no-files-found: error

      - name: Build side-by-side autofill test APK
        run: |
          cd android
          ./gradlew -I tools/autofill-test.init.gradle assembleDebug --no-daemon --stacktrace

      - name: Upload autofill test APK
        uses: actions/upload-artifact@v4
        with:
          name: ReWord-Autofill-Test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

